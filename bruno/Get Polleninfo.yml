info:
  name: Get Polleninfo
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/forecast/public?country=AT&lang=en&latitude=48.2082&longitude=16.3738&apikey={{apikey}}"
  params:
    - name: country
      value: AT
      type: query
    - name: lang
      value: en
      type: query
      description: de, en
    - name: latitude
      value: "48.2082"
      type: query
    - name: longitude
      value: "16.3738"
      type: query
    - name: apikey
      value: "{{apikey}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

